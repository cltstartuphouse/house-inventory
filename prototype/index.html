<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen inventory</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    color: #1c1c1c;
    background: #f5f5f3;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 16px 48px;
  }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { margin: 0 0 16px; color: #555; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }

  .panel {
    background: #fff;
    border: 1px solid #d9d9d5;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  #restock { border-left: 5px solid #b45309; }
  #restock.clear { border-left-color: #2f6f3e; }
  #checkedout { border-left: 5px solid #1d4ed8; }
  #checkedout.clear { border-left-color: #b5b5b0; }
  .summary ul { list-style: none; margin: 0; padding: 0; }
  .summary li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid #eee;
  }
  .summary li:first-child { border-top: 0; }
  .where { color: #555; font-size: 0.9rem; }
  .tag {
    flex: none;
    align-self: center;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .tag.low { background: #fdecc8; color: #7a4a00; }
  .tag.out { background: #fbd5d5; color: #8a1c1c; }
  .empty { margin: 0; color: #555; }

  label[for="search"] { display: block; font-weight: 600; margin-bottom: 4px; }
  #search {
    width: 100%;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid #b5b5b0;
    border-radius: 8px;
    margin-bottom: 16px;
    background: #fff;
  }

  .spot-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .label {
    flex: none;
    font-weight: 700;
    background: #1c1c1c;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .spot-head h2 { margin: 0; }

  .item { padding: 10px 0; border-top: 1px solid #eee; }
  .item-name { margin-bottom: 6px; }
  .item-main .item-name { margin-bottom: 0; }
  .asset-detail { color: #555; font-size: 0.9rem; }
  .asset-detail.out { color: #1e3a8a; font-weight: 600; }
  .action {
    width: 100%;
    min-height: 44px;
    margin-top: 8px;
    padding: 0 16px;
    font-size: 15px;
    font-family: inherit;
    color: #1c1c1c;
    background: #fff;
    border: 1px solid #b5b5b0;
    border-radius: 6px;
    cursor: pointer;
  }
  .action.primary { color: #fff; background: #1c1c1c; border-color: #1c1c1c; }
  .take-form { margin-top: 8px; }
  .take-form label { display: block; font-weight: 600; margin-bottom: 4px; }
  .take-form input {
    width: 100%;
    font-size: 16px;
    font-family: inherit;
    padding: 10px 12px;
    border: 1px solid #b5b5b0;
    border-radius: 8px;
    background: #fff;
  }
  .take-form .hint { margin: 4px 0 0; color: #555; font-size: 0.9rem; }
  .form-buttons { display: flex; gap: 6px; }
  .form-buttons .action { flex: 1; }
  .buttons { display: flex; gap: 6px; }
  .buttons button {
    flex: 1;
    min-height: 44px;
    font-size: 15px;
    font-family: inherit;
    color: #1c1c1c;
    background: #fff;
    border: 1px solid #b5b5b0;
    border-radius: 6px;
    cursor: pointer;
  }
  .buttons button[aria-pressed="true"] { font-weight: 700; border-width: 2px; }
  .buttons button.stocked[aria-pressed="true"] { background: #d8ecdc; border-color: #2f6f3e; color: #1d4a28; }
  .buttons button.low[aria-pressed="true"] { background: #fdecc8; border-color: #b45309; color: #7a4a00; }
  .buttons button.out[aria-pressed="true"] { background: #fbd5d5; border-color: #b42318; color: #8a1c1c; }
  .buttons button:focus-visible, .action:focus-visible, .take-form input:focus-visible, #search:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }

  @media (min-width: 520px) {
    .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .item-name { margin-bottom: 0; }
    .buttons { flex: none; width: 260px; }
    .item-main { flex: 1; min-width: 0; }
    .item > .action { flex: none; width: 140px; margin-top: 0; }
    .item.asking { display: block; }
  }
</style>
</head>
<body>
<main>
  <h1>Kitchen inventory</h1>
  <p class="sub">Tap Stocked, Low or Out for supplies. Tap Take it to check out anything else.</p>

  <section id="restock" class="panel summary" aria-live="polite">
    <h2>Needs restocking</h2>
    <div id="restock-body"></div>
  </section>

  <section id="checkedout" class="panel summary" aria-live="polite">
    <h2>Checked out now</h2>
    <div id="checkedout-body"></div>
  </section>

  <label for="search">Search items</label>
  <input id="search" type="search" placeholder="Type an item name" autocomplete="off">

  <div id="spots"></div>
</main>

    { id: "k10-sparkling-water-grapefruit", name: "Sparkling water grapefruit", room: "Kitchen", spot: "Fridge", spot_label: "K10", type: "consumable", status: "Stocked", checked_out_for: null, checked_out_at: null },
    { id: "k10-sparkling-water-lemon", name: "Sparkling water lemon", room: "Kitchen", spot: "Fridge", spot_label: "K10", type: "consumable", status: "Stocked", checked_out_for: null, checked_out_at: null },
    { id: "k10-coke", name: "Coke", room: "Kitchen", spot: "Fridge", spot_label: "K10", type: "consumable", status: "Stocked", checked_out_for: null, checked_out_at: null }
  ];

  var STATUSES = ["Stocked", "Low", "Out"];
  var STORAGE_KEY = "house-inventory.kitchen.status";

  var CHECKOUT_KEY = "house-inventory.kitchen.checkouts";

  var query = "";
  var askingId = null;     // the asset showing the "What's it for?" question, if any
  var reasonDraft = "";    // what has been typed into that question so far
  var pendingFocus = null; // which control to focus after the next redraw
  var focusNode = null;

  // Saved statuses look like { "k1-dish-soap": "Low" }.
  function loadSaved() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return saved && typeof saved === "object" ? saved : {};
    } catch (e) {
      return {};
    }
  }

  function save() {
    var out = {};
    ITEMS.forEach(function (item) {
      if (item.type === "consumable") out[item.id] = item.status;
    });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
    } catch (e) {
      // Storage can be blocked in private windows. The page still works until refresh.
    }
  }

  // Saved check-outs look like
  // { "k9-microwave": { "checked_out_for": "Thursday meetup", "checked_out_at": "2026-11-05T23:10:00.000Z" } }.
  // An event or a reason only. Never a person's name.
  function loadCheckouts() {
    try {
      var saved = JSON.parse(localStorage.getItem(CHECKOUT_KEY) || "{}");
      return saved && typeof saved === "object" ? saved : {};
    } catch (e) {
      return {};
    }
  }

  function saveCheckouts() {
    var out = {};
    ITEMS.forEach(function (item) {
      if (item.type === "asset" && item.status === "Checked out") {
        out[item.id] = { checked_out_for: item.checked_out_for, checked_out_at: item.checked_out_at };
      }
    });
    try {
      localStorage.setItem(CHECKOUT_KEY, JSON.stringify(out));
    } catch (e) {
      // Storage can be blocked in private windows. The page still works until refresh.
    }
  }

  function formatTime(iso) {
    var date = new Date(iso);
    if (isNaN(date.getTime())) return "an unknown time";
    return date.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderRestock() {
    var panel = document.getElementById("restock");
    var body = document.getElementById("restock-body");
    body.textContent = "";

    var needed = ITEMS.filter(function (item) {
      return item.type === "consumable" && item.status !== "Stocked";
    });
    // Out comes before Low.
    needed.sort(function (a, b) { return (a.status === "Out" ? 0 : 1) - (b.status === "Out" ? 0 : 1); });

    panel.classList.toggle("clear", needed.length === 0);
    if (needed.length === 0) {
      body.appendChild(el("p", "empty", "Nothing right now. Everything is stocked."));
      return;
    }

    var list = el("ul");
    needed.forEach(function (item) {
      var row = el("li");
      var left = el("div");
      left.appendChild(el("div", "", item.name));
      left.appendChild(el("div", "where", item.spot_label + " " + item.spot));
      row.appendChild(left);
      row.appendChild(el("span", "tag " + item.status.toLowerCase(), item.status));
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  function renderCheckedOut() {
    var panel = document.getElementById("checkedout");
    var body = document.getElementById("checkedout-body");
    body.textContent = "";

    var out = ITEMS.filter(function (item) {
      return item.type === "asset" && item.status === "Checked out";
    });
    // Longest out comes first.
    out.sort(function (a, b) { return a.checked_out_at < b.checked_out_at ? -1 : a.checked_out_at > b.checked_out_at ? 1 : 0; });

    panel.classList.toggle("clear", out.length === 0);
    if (out.length === 0) {
      body.appendChild(el("p", "empty", "Nothing is checked out."));
      return;
    }

    var list = el("ul");
    out.forEach(function (item) {
      var row = el("li");
      var left = el("div");
      left.appendChild(el("div", "", item.name));
      left.appendChild(el("div", "where", "For " + item.checked_out_for));
      left.appendChild(el("div", "where", "Since " + formatTime(item.checked_out_at)));
      left.appendChild(el("div", "where", "Goes back to " + item.spot_label + " " + item.spot));
      row.appendChild(left);
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  // The "What's it for?" question shown after tapping Take it.
  function buildTakeForm(item) {
    var form = el("form", "take-form");
    var label = el("label", "", "What's it for?");
    label.htmlFor = "reason-" + item.id;
    var input = el("input");
    input.id = "reason-" + item.id;
    input.type = "text";
    input.maxLength = 80;
    input.required = true;
    input.autocomplete = "off";
    input.placeholder = "Thursday meetup";
    input.value = reasonDraft;
    input.addEventListener("input", function () { reasonDraft = input.value; });

    var buttons = el("div", "form-buttons");
    var take = el("button", "action primary", "Take it");
    take.type = "submit";
    var cancel = el("button", "action", "Cancel");
    cancel.type = "button";
    cancel.addEventListener("click", function () {
      askingId = null;
      reasonDraft = "";
      pendingFocus = "action:" + item.id;
      renderSpots();
    });
    buttons.appendChild(take);
    buttons.appendChild(cancel);

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var reason = input.value.replace(/\s+/g, " ").trim();
      if (!reason) {
        input.focus();
        return;
      }
      item.status = "Checked out";
      item.checked_out_for = reason;
      item.checked_out_at = new Date().toISOString();
      askingId = null;
      reasonDraft = "";
      saveCheckouts();
      pendingFocus = "action:" + item.id;
      render();
    });

    form.appendChild(label);
    form.appendChild(input);
    form.appendChild(el("p", "hint", "An event or a reason, like Thursday meetup or Back room TV. No people's names."));
    form.appendChild(buttons);
    if (pendingFocus === "reason") focusNode = input;
    return form;
  }

  function renderAsset(row, item) {
    var out = item.status === "Checked out";
    var main = el("div", "item-main");
    main.appendChild(el("div", "item-name", item.name));
    main.appendChild(el("div", out ? "asset-detail out" : "asset-detail",
      out ? "Out for " + item.checked_out_for + " since " + formatTime(item.checked_out_at)
          : "Available at " + item.spot_label + " " + item.spot));
    row.appendChild(main);

    if (!out && askingId === item.id) {
      row.className = "item asking";
      row.appendChild(buildTakeForm(item));
      return;
    }

    var button = el("button", out ? "action" : "action primary", out ? "Put it back" : "Take it");
    button.type = "button";
    button.setAttribute("aria-label", (out ? "Put it back: " : "Take it: ") + item.name);
    button.addEventListener("click", function () {
      if (out) {
        item.status = "Available";
        item.checked_out_for = null;
        item.checked_out_at = null;
        saveCheckouts();
        pendingFocus = "action:" + item.id;
        render();
      } else {
        askingId = item.id;
        reasonDraft = "";
        pendingFocus = "reason";
        renderSpots();
      }
    });
    if (pendingFocus === "action:" + item.id) focusNode = button;
    row.appendChild(button);
  }

  function renderSpots() {
    focusNode = null;
    drawSpots();
    if (focusNode) focusNode.focus();
    focusNode = null;
    pendingFocus = null;
  }

  function drawSpots() {
    var container = document.getElementById("spots");
    container.textContent = "";

    var q = query.trim().toLowerCase();
    var visible = ITEMS.filter(function (item) {
      return item.name.toLowerCase().indexOf(q) !== -1;
    });

    if (visible.length === 0) {
      container.appendChild(el("p", "empty", "No items match that search."));
      return;
    }

    // Group by spot label, keeping the order from the data.
    var groups = [];
    var byLabel = {};
    visible.forEach(function (item) {
      if (!byLabel[item.spot_label]) {
        byLabel[item.spot_label] = { label: item.spot_label, spot: item.spot, items: [] };
        groups.push(byLabel[item.spot_label]);
      }
      byLabel[item.spot_label].items.push(item);
    });

    groups.forEach(function (group) {
      var section = el("section", "panel");
      var head = el("div", "spot-head");
      head.appendChild(el("span", "label", group.label));
      head.appendChild(el("h2", "", group.spot));
      section.appendChild(head);

      group.items.forEach(function (item) {
        var row = el("div", "item");

        // Assets can be taken and put back. Consumables get status buttons.
        if (item.type === "asset") {
          renderAsset(row, item);
          section.appendChild(row);
          return;
        }

        row.appendChild(el("div", "item-name", item.name));

        var buttons = el("div", "buttons");
        buttons.setAttribute("role", "group");
        buttons.setAttribute("aria-label", "Status for " + item.name);
        STATUSES.forEach(function (status) {
          var button = el("button", status.toLowerCase(), status);
          button.type = "button";
          button.setAttribute("aria-pressed", String(item.status === status));
          button.addEventListener("click", function () {
            item.status = status;
            save();
            // Update this row's buttons in place so the tapped button keeps focus.
            Array.prototype.forEach.call(buttons.children, function (other) {
              other.setAttribute("aria-pressed", String(other === button));
            });
            renderRestock();
          });
          buttons.appendChild(button);
        });
        row.appendChild(buttons);
        section.appendChild(row);
      });

      container.appendChild(section);
    });
  }

  function render() {
    renderRestock();
    renderCheckedOut();
    renderSpots();
  }

  // Apply any saved statuses on top of the starting data.
  var saved = loadSaved();
  ITEMS.forEach(function (item) {
    if (item.type === "consumable" && STATUSES.indexOf(saved[item.id]) !== -1) item.status = saved[item.id];
  });

  // Apply any saved check-outs, skipping anything that doesn't look right.
  var savedCheckouts = loadCheckouts();
  ITEMS.forEach(function (item) {
    var saved = savedCheckouts[item.id];
    if (item.type !== "asset" || !saved) return;
    var reason = typeof saved.checked_out_for === "string" ? saved.checked_out_for.trim() : "";
    var at = saved.checked_out_at;
    if (!reason || typeof at !== "string" || isNaN(new Date(at).getTime())) return;
    item.status = "Checked out";
    item.checked_out_for = reason;
    item.checked_out_at = at;
  });

  document.getElementById("search").addEventListener("input", function (event) {
    query = event.target.value;
    renderSpots();
  });

  render();
</script>
</body>
</html>
