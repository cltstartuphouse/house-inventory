# Advisory checks on the pull request's own code. Not required to merge: a pull
# request from a fork runs its own copy of this file, so the required gate is
# guard.yml. This flags vulnerable dependencies once the project has any.
name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review new dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
