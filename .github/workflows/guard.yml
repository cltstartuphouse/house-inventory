# Guard: the required check on every pull request into main.
#
# Why pull_request_target: it runs this file as it exists on main, so a pull
# request can't edit the guard to make it pass. That event is only safe because
# this workflow NEVER checks out or runs the pull request's code. It only reads
# the list of changed files and their diffs through the GitHub API, with a
# read-only token and no secrets. Keep it that way: no actions/checkout, no
# running anything from the pull request.
name: guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "## Guard" >> "$summary"

          # Never echo raw file names or diff text: strip anything that could
          # be read as a workflow command or leak a secret into the logs.
          clean() { printf '%s' "$1" | tr -c 'A-Za-z0-9._/ -' '_' | cut -c1-200; }
          flag() { echo "::error title=guard::$1"; echo "- $1" >> "$summary"; fail=1; }

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | tojson' > "$RUNNER_TEMP/files.jsonl"
          count=$(wc -l < "$RUNNER_TEMP/files.jsonl" | tr -d ' ')
          echo "Files changed: $count" >> "$summary"
          if [ "$count" -gt 300 ]; then
            flag "This pull request changes $count files. Split it into smaller pull requests."
          fi

          secret_re='-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|sk-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|sbp_[a-f0-9]{40}|eyJhbGciOi[A-Za-z0-9_-]{10,}\.eyJ'
          binary_re='\.(exe|dll|so|dylib|bin|hex|elf|o|a|obj|class|jar|war|pyc|whl|apk|ipa|dmg|iso|img|msi|deb|rpm|zip|tar|gz|tgz|bz2|xz|7z|rar)$'
          keyfile_re='(^|/)(id_rsa|id_dsa|id_ecdsa|id_ed25519)$|\.(pem|key|p12|pfx|jks|keystore|ppk)$'
          media_re='\.(png|jpe?g|gif|webp|heic|heif|bmp|tiff?|mp4|mov|avi|mkv|webm|mp3|wav|m4a|aac|flac)$'

          while IFS= read -r line; do
            name=$(jq -r '.filename' <<<"$line")
            status=$(jq -r '.status' <<<"$line")
            safe=$(clean "$name")
            lower=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            base="${lower##*/}"

            # Repo plumbing is maintainer-only, including deletes and renames.
            prev=$(jq -r '.previous_filename // ""' <<<"$line")
            for p in "$name" "$prev"; do
              case "$p" in
                .github/*|LICENSE|SECURITY.md|CODE_OF_CONDUCT.md)
                  flag "$(clean "$p"): only maintainers change this file." ;;
              esac
            done

            [ "$status" = "removed" ] && continue

            if [[ "$base" == .env || "$base" == .env.* ]] && [[ "$base" != .env.example ]]; then
              flag "$safe: .env files hold secrets and can't be committed. Use .env.example with fake values."
            fi
            if [[ "$lower" =~ $keyfile_re ]]; then
              flag "$safe: looks like a key or certificate file. Keep it on your machine."
            fi
            if [[ "$lower" =~ $binary_re ]]; then
              flag "$safe: binaries, firmware builds and archives can't be committed. Commit the source instead."
            fi
            if [[ "$lower" =~ $media_re ]] && [[ "$lower" != docs/* ]] && [[ "$lower" != public/* ]]; then
              flag "$safe: photos and media go in docs/ or public/ only."
            fi

            # Size and type, read from the pull request's commit without checking it out.
            enc=$(jq -rn --arg p "$name" '$p | split("/") | map(@uri) | join("/")')
            if meta=$(gh api "repos/$HEAD_REPO/contents/$enc?ref=$HEAD_SHA" --jq '[.type, (.size|tostring)] | join(" ")' 2>/dev/null); then
              type="${meta%% *}"; size="${meta##* }"
              if [ "$type" != "file" ]; then
                flag "$safe: symlinks and submodules can't be committed."
              elif [ "$size" -gt 1000000 ]; then
                flag "$safe: over 1 MB. Keep large files out of the repo."
              fi
            else
              flag "$safe: couldn't check this file's size. A maintainer will take a look."
            fi

            # Added lines that look like a key or token. The match is never printed.
            if jq -r '.patch // ""' <<<"$line" | grep -E '^\+' | grep -Eq -- "$secret_re"; then
              flag "$safe: an added line looks like a key or token. Remove it, rotate the key, and use a .env file."
            fi
          done < "$RUNNER_TEMP/files.jsonl"

          if [ "$fail" -ne 0 ]; then
            echo "Guard found problems. Fix them and push again." >> "$summary"
            exit 1
          fi
          echo "All clear." >> "$summary"
